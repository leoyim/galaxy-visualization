<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Nearby Universe Galaxy Visualization</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#10233a"/>
      <stop offset="1" stop-color="#04060c"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="0.32" stop-color="#ffcf6b"/>
      <stop offset="0.7" stop-color="#ff9d3d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff9d3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fe3ff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#5fe3ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#a8ecff" stop-opacity="0.32"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- background stars -->
  <g fill="#8fb8d8" opacity="0.6">
    <circle cx="11" cy="15" r="0.9"/>
    <circle cx="52" cy="12" r="0.7"/>
    <circle cx="13" cy="50" r="0.7"/>
    <circle cx="54" cy="52" r="0.9"/>
  </g>

  <!-- inclined orbit: the drill-down from galaxy scale to orbital motion -->
  <ellipse cx="32" cy="32" rx="23" ry="9.5" fill="none"
           stroke="#2f5b7d" stroke-width="1.1" transform="rotate(-30 32 32)"/>

  <!-- four spiral arms -->
  <g fill="none" stroke="url(#arm)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 32 C35 27 41 26 44 30 C47 35 43 41 37 41 C30 41 26 35 28 29"/>
    <path d="M32 32 C35 27 41 26 44 30 C47 35 43 41 37 41 C30 41 26 35 28 29" transform="rotate(90 32 32)"/>
    <path d="M32 32 C35 27 41 26 44 30 C47 35 43 41 37 41 C30 41 26 35 28 29" transform="rotate(180 32 32)"/>
    <path d="M32 32 C35 27 41 26 44 30 C47 35 43 41 37 41 C30 41 26 35 28 29" transform="rotate(270 32 32)"/>
  </g>

  <!-- galactic nucleus -->
  <circle cx="32" cy="32" r="11" fill="url(#core)"/>
  <circle cx="32" cy="32" r="3.4" fill="#fff8e6"/>

  <!-- orbiting body -->
  <circle cx="52" cy="21" r="4.8" fill="#5fe3ff" opacity="0.2"/>
  <circle cx="52" cy="21" r="2.7" fill="#5fe3ff"/>
</svg>

name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时仓库可能尚未启用 Pages，允许自动启用，避免 configure-pages 直接 404 失败
          enablement: true

      - name: 组装静态站点（只发布必要文件，排除废弃分支与本地状态）
        run: |
          mkdir -p _site/vendor/addons/controls _site/vendor/addons/renderers
          cp index.html galaxy.html celestial.js main_galaxy.js CNAME .nojekyll \
             favicon.svg favicon-32.png apple-touch-icon.png _site/
          cp vendor/three.module.min.js _site/vendor/
          cp vendor/addons/controls/OrbitControls.js _site/vendor/addons/controls/
          cp vendor/addons/renderers/CSS2DRenderer.js _site/vendor/addons/renderers/
          echo "发布文件清单："
          find _site -type f | sort

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
